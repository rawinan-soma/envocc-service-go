services:
  database:
    image: postgres:17-alpine
    container_name: envocc-services-db
    restart: always
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=envocc_services
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - envocc-service
  api:
    image: rawinan/envocc_service:test
    ports:
      - "3600:3600"
    restart: unless-stopped
    networks:
      - envocc_service

volumes:
  postgres_data:
networks:
  envocc-service:
    driver: bridge
